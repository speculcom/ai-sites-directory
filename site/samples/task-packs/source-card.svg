<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Trace a claim to its source</title><desc id="desc">Original fictional storyboard card. Three linked boxes show claim, source and scope.</desc><rect width="960" height="540" fill="#f8f6f1"/><text x="60" y="95" fill="#25383c" font-family="sans-serif" font-size="38" font-weight="700">A claim needs a place to check</text><g fill="#fff" stroke="#245864" stroke-width="3"><rect x="60" y="180" width="240" height="150" rx="20"/><rect x="360" y="180" width="240" height="150" rx="20"/><rect x="660" y="180" width="240" height="150" rx="20"/></g><g stroke="#245864" stroke-width="4"><path d="M300 255h60m-14-10 14 10-14 10M600 255h60m-14-10 14 10-14 10" fill="none"/></g><g fill="#25383c" font-family="sans-serif" font-size="30" text-anchor="middle"><text x="180" y="265">CLAIM</text><text x="480" y="265">SOURCE</text><text x="780" y="265">SCOPE</text></g><text x="60" y="410" fill="#25383c" font-family="sans-serif" font-size="24">What was said? Where? For whom and when?</text><text x="60" y="490" fill="#4b6268" font-family="sans-serif" font-size="18">Specul | Teaching graphic | See site terms | Not a rendered video</text></svg>
